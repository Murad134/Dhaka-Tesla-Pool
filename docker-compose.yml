services:

  postgres:
    image: postgres:16-alpine
    container_name: dhaka-tesla-pool-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dhaka_tesla_pool}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dhaka_tesla_pool}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - app_network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: dhaka-tesla-pool-api
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000

      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dhaka_tesla_pool}?schema=public

      JWT_SECRET: ${JWT_SECRET:-change-this-secret-please-use-a-32-character-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}

      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}

    ports:
      - "4000:4000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:4000/health | grep -q '\"status\":\"ok\"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - app_network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: dhaka-tesla-pool-web
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}

    ports:
      - "3001:3000"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - app_network


volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge